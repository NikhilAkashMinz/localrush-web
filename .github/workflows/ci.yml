# Check: proves the code type-checks, passes its tests and builds.
# Runs on every pull request, and is called by the Deploy workflow before it packages anything.
name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # "npm ci" installs exactly what package-lock.json records, so every run is repeatable.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
