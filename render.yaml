# Render Blueprint: deploys the LocalRush website and API from the Dockerfile, as the live
# service (login with Google or email through Firebase, no demo accounts). In Render choose
# New > Blueprint and pick this repository. Render asks once for each value marked
# "sync: false" (see README, "Going live"), and makes SESSION_SECRET itself.
services:
  - type: web
    name: localrush
    runtime: docker
    # The free plan sleeps after 15 minutes without visitors; the next visit waits about a
    # minute while it wakes. Change to "starter" for a site that is always awake.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: LOCALRUSH_MODE
        value: live
      # Start with the 15 sample shops (labelled "Sample") so the site has shops from day one.
      # Set to "false" before the first start for a site with only the real shops you add.
      - key: SAMPLE_SHOPS
        value: "true"
      # MongoDB Atlas connection string, ending in /localrush?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # From Firebase: Project settings > General > Your apps > Web app.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # Emails that may use /admin to add shops and partners, comma separated.
      - key: ADMIN_EMAILS
        sync: false
      - key: PORT
        value: "3000"
