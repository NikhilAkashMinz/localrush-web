# Render Blueprint: deploys the LocalRush website and API from the Dockerfile, as the live
# service (real SMS login, no sample data). In Render choose New > Blueprint and pick this
# repository. Render asks once for each value marked "sync: false" (see README, "Going live"),
# and makes SESSION_SECRET itself.
services:
  - type: web
    name: localrush
    runtime: docker
    # The free plan sleeps after 15 minutes without visitors; the next visit waits about a
    # minute while it wakes. Change to "starter" for a site that is always awake.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: LOCALRUSH_MODE
        value: live
      # MongoDB Atlas connection string, ending in /localrush?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # From Firebase: Project settings > General > Your apps > Web app (SMS login).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # Mobile numbers that may use /admin to add shops and partners, comma separated.
      - key: ADMIN_PHONES
        sync: false
      - key: PORT
        value: "3000"
